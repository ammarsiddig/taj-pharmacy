version: 0
defaultQuotaMode: conservation
assumptions:
  windsurfWeeklyRemainingPercent: 38
  v0Policy: "manual approval required; manager may route and review but must not auto-merge"

quotaModes:
  fast:
    condition: "weekly >= 70 and daily >= 30"
    policy: "Use best available coding model for implementation and review."
  normal:
    condition: "weekly >= 40 and weekly < 70"
    policy: "Use Windsurf for implementation, route heavier review to specialist models."
  conservation:
    condition: "weekly >= 20 and weekly < 40"
    policy: "Use Windsurf only for scaffold and focused edits; route long review externally."
  emergency:
    condition: "weekly < 20 or daily < 15"
    policy: "Use Windsurf only for urgent coordination; prefer Copilot or external review."

agents:
  openRouterDeepSeek:
    role: "Head architect and manager agent for task routing, prompts, reviews, and merge recommendations."
    primaryModel: "deepseek/deepseek-v4-pro"
    fallbackModel: "deepseek/deepseek-v4-flash"
    preferredWork:
      - receive owner goals and break them into tasks
      - select implementation and review agents
      - write prompts for Cascade, Gemini, Copilot, and future GPT-5.5
      - review UI/UX, Rust, Tauri, frontend, backend, database, security, and workflow risk
      - produce merge recommendations
    avoid:
      - exposing secrets
      - auto-merging
      - publishing or activating workflows
      - autonomous production actions
    output: "Task plan, routing decision, agent prompts, review notes, and merge recommendation."

  windsurfCascade:
    role: "Implementation agent for scoped file edits and local commands."
    preferredWork:
      - project scaffold
      - focused TypeScript or React edits
      - n8n workflow structure
      - documentation and rule alignment
    avoid:
      - long architecture reviews in conservation mode
      - live production actions
      - final merge approval

  githubCopilot:
    role: "Inline coding assistant for autocomplete, small refactors, tests, and PR/code support."
    preferredWork:
      - tests
      - small UI edits
      - simple refactors
    avoid:
      - pharmacy business logic authority
      - database migration decisions
      - project management
      - final review

  rooDeepSeek:
    role: "Legacy alias for DeepSeek reviewer; prefer openRouterDeepSeek for manager/head architect routing."
    primaryModel: "deepseek/deepseek-v4-pro"
    fallbackModel: "deepseek/deepseek-v4-flash"
    preferredWork:
      - Rust command review
      - SQL and migration review
      - inventory, expiry, prescription, payment, and sync logic review
    output: "Review notes only unless explicitly assigned edits."

  geminiUltra:
    role: "Architecture reviewer for large-context system, cross-module, and medical workflow safety review."
    preferredWork:
      - cross-system architecture review
      - daily reports
      - risk summaries
      - scalability and maintainability review
    output: "Architecture notes and impact reports."

  gpt55Opus:
    role: "High-risk integration and security reviewer."
    preferredWork:
      - auth and permission changes
      - secrets and token handling
      - sync and payment integration
      - final review before merge
    output: "Review notes and approval blockers."

routingRules:
  docsOnly:
    risk: low
    primary: windsurfCascade
    review: null
    requiresAiReview: false
    deterministicGate: true
    allowAutoEdit: true

  reactUiOnly:
    risk: medium
    primary: windsurfCascade
    manager: openRouterDeepSeek
    fallback: githubCopilot
    review: null
    allowAutoEdit: true

  rustDatabasePharmacyLogic:
    risk: high
    manager: openRouterDeepSeek
    primary: windsurfCascade
    requiredReview: openRouterDeepSeek
    primaryModel: "deepseek/deepseek-v4-pro"
    fallbackModel: "deepseek/deepseek-v4-flash"
    architecture: geminiUltra
    allowAutoEdit: false
    requiresHumanApproval: true

  authPermissionsSecretsTokens:
    risk: critical
    manager: openRouterDeepSeek
    primary: windsurfCascade
    requiredReview: openRouterDeepSeek
    architecture: geminiUltra
    optionalStrategy: gpt55Opus
    allowAutoEdit: false
    requiresHumanApproval: true

  n8nWorkflowScaffold:
    risk: medium
    manager: openRouterDeepSeek
    primary: windsurfCascade
    review: openRouterDeepSeek
    allowAutoEdit: false
    requiresHumanApproval: true

  architectureCrossModule:
    risk: high
    manager: openRouterDeepSeek
    primary: windsurfCascade
    architecture: geminiUltra
    requiredReview: openRouterDeepSeek
    allowAutoEdit: false
    requiresHumanApproval: true
