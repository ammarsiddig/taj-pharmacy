version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=pms_cloud
      - POSTGRES_USER=pms
      - POSTGRES_PASSWORD=${PMS_DB_PASSWORD:-pms_secure_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms_cloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: pms-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - pms-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=pms_cloud
      - PGUSER=pms
      - PGPASSWORD=${PMS_DB_PASSWORD:-pms_secure_password}
      - PMS_JWT_SECRET=${PMS_JWT_SECRET:-change-this-secret-in-production}
      - PMS_ADMIN_TOKEN=${PMS_ADMIN_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: pms-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./web-dist:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  pms-data:
  postgres-data:
  caddy-data:
  caddy-config:
